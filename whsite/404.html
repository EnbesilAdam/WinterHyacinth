<!DOCTYPE html>
<html lang="tr">
<head>
    <link rel="robots" href="/robots.txt">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sayfa Bulunamadı | Winter Hyacinth Studios</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <meta name="description" content="Aradığınız sayfa Winter Hyacinth Studios üzerinde bulunamadı.">
    <link rel="canonical" href="https://winterhyacinth.gt.tc/404.html">

    <style>
        body { background: #0b0e14; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        /* Navbar */
        .navbar { position: fixed; top: 0; width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(10px); z-index: 1000; box-sizing: border-box; border-bottom: 1px solid #1a1f29; }
        .logo { font-size: 1.5rem; font-weight: bold; text-decoration: none; color: white; }
        .logo span { color: #7d5fff; }
        .nav-links a { color: #ccc; text-decoration: none; margin-left: 25px; transition: 0.3s; font-size: 0.9rem; font-weight: 500; }
        .nav-links a:hover { color: #7d5fff; }

        /* 404 Error Section */
        .error-container { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 120px 20px 60px; background: radial-gradient(circle at center, #1a1f29 0%, #0b0e14 100%); }
        .error-content h1 { font-size: 7rem; margin: 0; line-height: 1; color: #7d5fff; font-weight: 800; }
        .error-content h2 { font-size: 2rem; margin: 20px 0 10px 0; }
        .error-content p { color: #888; margin: 0 0 30px 0; font-size: 1.1rem; max-width: 500px; margin-left: auto; margin-right: auto; }
        
        .error-btn { padding: 12px 35px; border-radius: 30px; text-decoration: none; display: inline-block; font-weight: bold; transition: 0.3s; background: #7d5fff; color: white; border: 2px solid #7d5fff; }
        .error-btn:hover { background: #6c4de6; transform: translateY(-3px); }

        footer { text-align: center; padding: 30px; color: #555; background: #07090d; border-top: 1px solid #1a1f29; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">Winter<span>hyacinth</span></a>
        <div class="nav-links">
            <a href="index.html#games">Projeler</a>
            <a href="index.html#devlogs">Günlükler</a>
            <a href="about.html">Hakkımızda</a>
            <a href="contact.html">İletişim</a>
        </div>
    </nav>

    <main class="error-container">
        <div class="error-content">
            <h1>404</h1>
            <h2>Kayıp Dijital Evren</h2>
            <p>Aradığınız sayfa silinmiş, taşınmış veya hiç var olmamış olabilir. Gelin sizi ana üsse geri götürelim.</p>
            <a href="index.html" class="error-btn"><i class="fas fa-home" style="margin-right: 8px;"></i> Ana Sayfaya Dön</a>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Winter Hyacinth Studios. All rights reserved.</p>
    </footer>

</body>
</html>
